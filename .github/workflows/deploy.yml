name: Deploy to EC2

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          test -n "$EC2_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 3.7.29.147 >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host ec2
            HostName 3.7.29.147
            User ubuntu
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Pull exact successful commit
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          ssh ec2 "cd /opt/lessonfoundry && git fetch origin && git checkout main && git pull --ff-only origin main && test \"\$(git rev-parse HEAD)\" = \"$SHA\""

      - name: Apply ordered migrations
        run: |
          ssh ec2 "cd /opt/lessonfoundry && bash scripts/deploy_migrations.sh"

      - name: Rebuild and restart containers
        run: |
          ssh ec2 'cd /opt/lessonfoundry && docker compose build api worker web && docker compose up -d --remove-orphans && sleep 10 && curl -fsS http://127.0.0.1:8000/api/ready'

      - name: Verify deployment
        run: |
          ssh ec2 'cd /opt/lessonfoundry && curl -fsS http://127.0.0.1:8000/api/health && curl -fsS http://127.0.0.1:8000/api/ready && docker compose ps'
