name: Deploy to EC2

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST || '16.4.139.162' }}
          EC2_USER: ${{ secrets.EC2_USER || 'ec2-user' }}
        run: |
          test -n "$EC2_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host ec2
            HostName $EC2_HOST
            User $EC2_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Pull exact successful commit
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          ssh ec2 "cd /opt/lessonfoundry && git fetch origin && git checkout main && git pull --ff-only origin main && test \"\$(git rev-parse HEAD)\" = \"$SHA\""

      - name: Apply ordered migrations
        run: |
          ssh ec2 "cd /opt/lessonfoundry && bash scripts/deploy_migrations_sqlite.sh"

      - name: Restart systemd services
        run: |
          ssh ec2 'sudo systemctl restart lessonfoundry-api lessonfoundry-worker lessonfoundry-web && sleep 8'

      - name: Verify deployment
        run: |
          ssh ec2 'curl -fsS http://127.0.0.1:8000/api/health && curl -fsS http://127.0.0.1:8000/api/ready && systemctl is-active lessonfoundry-api lessonfoundry-worker lessonfoundry-web nginx'
