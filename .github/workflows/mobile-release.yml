name: Mobile Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.0.0)"
        required: true
        default: "v0.1.0"
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: true

jobs:
  build-and-release:
    name: Build Mobile & Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Typecheck
        working-directory: mobile
        run: npm run typecheck

      - name: Validate Expo project
        working-directory: mobile
        run: npx expo config --type public

      - name: Export Expo web bundle
        working-directory: mobile
        run: npx expo export --platform web --output-dir dist --clear
        env:
          NODE_ENV: production

      - name: Package mobile web bundle
        working-directory: mobile
        run: |
          tar -czf ../lessonfoundry-mobile-web-${{ inputs.version }}.tar.gz -C dist .

      - name: Package mobile source
        run: |
          tar -czf lessonfoundry-mobile-source-${{ inputs.version }}.tar.gz \
            mobile/App.tsx mobile/app.json mobile/eas.json mobile/package.json mobile/package-lock.json mobile/tsconfig.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Build Android APK with EAS
        if: ${{ secrets.EXPO_TOKEN != '' }}
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli@latest build --platform android --profile preview --non-interactive --wait --output ../lessonfoundry-android-${{ inputs.version }}.apk || {
            npx eas-cli@latest build:list --platform android --limit 1 --json > ../eas-build.json
            node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('../eas-build.json')); const url=x[0]?.artifacts?.buildUrl || x[0]?.artifacts?.applicationArchiveUrl; if(!url) throw new Error('EAS returned no APK URL'); fs.writeFileSync('../lessonfoundry-android-${{ inputs.version }}.url', url);"
            curl -fL "$(cat ../lessonfoundry-android-${{ inputs.version }}.url)" -o ../lessonfoundry-android-${{ inputs.version }}.apk
          }

      - name: Build Android APK with local Gradle
        if: ${{ secrets.EXPO_TOKEN == '' }}
        working-directory: mobile
        run: |
          npx expo prebuild --platform android --clean
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          APK_FILE="$(find app/build/outputs/apk -name "*.apk" | head -n 1)"
          if [ -z "$APK_FILE" ]; then
            echo "No APK produced by Gradle"
            exit 1
          fi
          cp "$APK_FILE" "../../lessonfoundry-android-${{ inputs.version }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: "LessonFoundry ${{ inputs.version }}"
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: |
            lessonfoundry-mobile-web-${{ inputs.version }}.tar.gz
            lessonfoundry-mobile-source-${{ inputs.version }}.tar.gz
          body: |
            ## LessonFoundry ${{ inputs.version }}

            ### Mobile App
            - **Android APK**: `lessonfoundry-android-${{ inputs.version }}.apk` — Installable APK for Android phones
            - **Web Bundle**: `lessonfoundry-mobile-web-${{ inputs.version }}.tar.gz` — Expo web export
            - **Source Package**: `lessonfoundry-mobile-source-${{ inputs.version }}.tar.gz` — Source files for development

            ### To run the mobile app locally:
            ```bash
            cd mobile
            npm install
            npx expo start
            ```
            Scan the QR code with Expo Go on your phone to test.

      - name: Attach Android APK
        if: ${{ hashFiles(format('lessonfoundry-android-{0}.apk', inputs.version)) != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          files: lessonfoundry-android-${{ inputs.version }}.apk
          fail_on_unmatched_files: false
