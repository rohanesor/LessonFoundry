# Local PostgreSQL development only. Secrets are supplied through an ignored .env
# or deployment secret store; no credential value belongs in this file.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${LOCAL_POSTGRES_USER:-lessonfoundry}
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?set LOCAL_POSTGRES_PASSWORD in ignored environment}
      POSTGRES_DB: ${LOCAL_POSTGRES_DB:-lessonfoundry}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10
  api:
    build: ./backend
    env_file: .env
    environment: &backend-env
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in ignored environment}
      AUTH_MODE: ${AUTH_MODE:-local}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      REAL_LLM_ENABLED: ${REAL_LLM_ENABLED:-false}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      LOCAL_STORAGE_PATH: /app/files
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 5s
      retries: 12
    volumes:
      - source-files:/app/files
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db:
        condition: service_healthy
  worker:
    build: ./backend
    command: ["python", "-m", "app.jobs.worker"]
    env_file: .env
    environment: *backend-env
    volumes:
      - source-files:/app/files
    depends_on:
      api:
        condition: service_healthy
  web:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://api:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
volumes:
  postgres-data:
  source-files:
