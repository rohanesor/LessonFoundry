<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/modernist-2d405345-c880-4218-92f2-cddc1804b608/styles.css">
<script src="_ds/modernist-2d405345-c880-4218-92f2-cddc1804b608/_ds_bundle.js"></script>
</helmet>
<div style="font-family:var(--font-body);color:var(--color-text)">
  <div style="display:grid;grid-template-columns:minmax(0,1.3fr) repeat(4,minmax(0,1fr));border-bottom:2px solid var(--color-divider)">
    <div style="padding:22px 24px;display:flex;flex-direction:column;gap:6px">
      <div style="display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;font-weight:600;color:var(--color-accent-700)"><dc-import name="LFIcon" icon="validation" size="14" hint-size="14px,14px"></dc-import>System verifies · pack {{ packVer }}</div>
      <div style="font-size:24px;font-weight:800;letter-spacing:-0.015em">Validation &amp; Provenance</div>
      <div style="font-size:13px;color:var(--color-neutral-800);line-height:1.5">{{ runLabel }}</div>
      <div><button class="btn btn-secondary" disabled="{{ running }}" onClick="{{ rerun }}" style="padding:5px 10px;font-size:13px;white-space:nowrap;flex:none">Re-run validation</button></div>
    </div>
    <sc-for list="{{ score }}" as="s" hint-placeholder-count="4">
      <div style="padding:22px 20px;border-left:1px solid var(--color-neutral-300);display:flex;flex-direction:column;gap:4px">
        <span style="font-size:11px;letter-spacing:0.08em;text-transform:uppercase;font-weight:600;color:var(--color-neutral-700)">{{ s.l }}</span>
        <span style="font-size:40px;font-weight:800;letter-spacing:-0.02em;line-height:1;color:{{ s.fg }}">{{ s.v }}</span>
        <span style="font-size:12px;color:var(--color-neutral-700)">{{ s.sub }}</span>
      </div>
    </sc-for>
  </div>
  <div style="display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:2px;padding:16px 24px 0">
    <sc-for list="{{ rows }}" as="c" hint-placeholder-count="9">
      <button onClick="{{ c.onClick }}" style="display:flex;flex-direction:column;gap:6px;padding:0;border:0;background:transparent;cursor:pointer;text-align:left;font:inherit"><span style="height:8px;background:{{ c.bar }}"></span><span style="font-size:11px;line-height:1.25;font-weight:{{ c.weight }};color:var(--color-neutral-800)">{{ c.name }}</span></button>
    </sc-for>
  </div>
  <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,400px);margin-top:18px;border-top:2px solid var(--color-divider)">
    <div style="min-width:0">
      <div style="display:grid;grid-template-columns:180px 120px minmax(0,1fr) 160px;gap:12px;padding:10px 24px;border-bottom:2px solid var(--color-divider);font-size:11px;letter-spacing:0.08em;text-transform:uppercase;font-weight:600;color:var(--color-neutral-700)"><span>Check</span><span>Status</span><span>Reason</span><span>Affected asset</span></div>
      <sc-for list="{{ rows }}" as="c" hint-placeholder-count="9">
        <button onClick="{{ c.onClick }}" style="display:grid;grid-template-columns:180px 120px minmax(0,1fr) 160px;gap:12px;align-items:start;width:100%;padding:12px 24px;border:0;border-bottom:1px solid var(--color-neutral-300);cursor:pointer;text-align:left;font:inherit;background:{{ c.bg }};color:var(--color-text);outline:2px solid {{ c.frame }};outline-offset:-2px">
          <span style="font-weight:700;font-size:13px">{{ c.name }}</span>
          <dc-import name="StatusBadge" status="{{ c.bs }}" hint-size="80px,20px"></dc-import>
          <span style="font-size:13px;line-height:1.45;color:{{ c.reasonFg }}">{{ c.reasonShown }}</span>
          <span style="font-size:12px;color:var(--color-neutral-800)">{{ c.asset }}</span>
        </button>
      </sc-for>
    </div>
    <div style="border-left:2px solid var(--color-divider);display:flex;flex-direction:column">
      <div style="padding:18px 20px;border-bottom:2px solid var(--color-divider);display:flex;flex-direction:column;gap:8px">
        <div style="font-size:11px;letter-spacing:0.08em;text-transform:uppercase;font-weight:600;color:var(--color-neutral-700)">Check detail</div>
        <div style="font-size:22px;font-weight:800;letter-spacing:-0.015em">{{ vc.name }}</div>
        <div><dc-import name="StatusBadge" status="{{ vc.s }}" hint-size="80px,20px"></dc-import></div>
      </div>
      <div style="padding:14px 20px;border-bottom:1px solid var(--color-neutral-300);display:flex;flex-direction:column;gap:4px"><span style="font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-neutral-700)">Reason</span><span style="font-size:14px;line-height:1.5">{{ vc.reason }}</span></div>
      <div style="padding:14px 20px;border-bottom:1px solid var(--color-neutral-300);display:flex;flex-direction:column;gap:8px"><span style="font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-neutral-700)">Evidence</span><span style="font-size:14px;font-weight:700">{{ vc.evLabel }}</span>
        <sc-if value="{{ vc.hasEv }}" hint-placeholder-val="{{ true }}"><div style="font-family:Georgia, 'Times New Roman', serif;font-size:13px;line-height:1.55;padding:10px 12px;background:var(--color-accent-100)">"{{ vc.evText }}"</div><button class="btn btn-secondary" onClick="{{ vc.onEv }}" style="justify-content:flex-start;margin-top:8px">View Source Evidence →</button></sc-if>
      </div>
      <div style="padding:14px 20px;border-bottom:1px solid var(--color-neutral-300);display:flex;flex-direction:column;gap:4px"><span style="font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-neutral-700)">Affected asset</span><span style="font-size:14px;font-weight:700">{{ vc.asset }}</span></div>
      <div style="padding:14px 20px;display:flex;flex-direction:column;gap:8px"><span style="font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-neutral-700)">Suggested action</span>
        <sc-if value="{{ vc.hasAction }}" hint-placeholder-val="{{ false }}"><button class="btn btn-primary" disabled="{{ locked }}" onClick="{{ vc.onAction }}" style="justify-content:flex-start">{{ vc.action }} →</button></sc-if>
        <sc-if value="{{ vc.noAction }}" hint-placeholder-val="{{ true }}"><span style="font-size:14px">{{ vc.action }}</span></sc-if>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:800},&quot;checks&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Check[]&quot;},&quot;packVer&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;v4&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;locked&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;coverage&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{covered:number;total:number}&quot;},&quot;initialSel&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;onViewEvidence&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(id:string)=&gt;void&quot;},&quot;onAction&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(go:string)=&gt;void&quot;}}">
const SC = { pass: 'oklch(0.45 0.11 150)', review: 'oklch(0.49 0.115 65)', fail: 'var(--lf-red-700, #ae1800)' };
const BAR = { pass: 'oklch(0.62 0.12 150)', review: 'oklch(0.75 0.13 75)', fail: 'var(--lf-red, #ec3013)', running: 'var(--color-neutral-400)' };
class Component extends DCLogic {
  state = { sel: null, running: false, at: null };
  renderVals() {
    const p = this.props, s = this.state, checks = p.checks || [];
    const firstBad = checks.find((c) => c.s === 'fail') || checks.find((c) => c.s === 'review') || checks[0] || {};
    const vcRaw = checks.find((c) => c.k === (s.sel || p.initialSel)) || firstBad;
    const counts = checks.reduce((a, c) => { a[c.s] = (a[c.s] || 0) + 1; return a; }, {});
    const rows = checks.map((c) => ({ ...c, bs: s.running ? 'running' : c.s, bar: s.running ? BAR.running : BAR[c.s], weight: c.k === vcRaw.k ? 800 : 500,
      reasonShown: s.running ? 'Checking…' : c.reason, reasonFg: s.running ? 'var(--color-neutral-600)' : 'var(--color-neutral-900)',
      bg: c.k === vcRaw.k ? 'var(--color-surface)' : 'transparent', frame: c.k === vcRaw.k ? 'var(--color-text)' : 'transparent', onClick: () => this.setState({ sel: c.k }) }));
    const cov = p.coverage || { covered: 3, total: 3 };
    return {
      packVer: p.packVer || 'v4', locked: !!p.locked, running: s.running, rows,
      runLabel: s.running ? 'Running 9 checks across 7 assets…' : `Last run ${s.at || p.lastRun || '11:06'} · 9 checks across 7 assets · every check links to its evidence`,
      rerun: () => { this.setState({ running: true }); setTimeout(() => this.setState({ running: false, at: new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) }), 1300); },
      score: [
        { l: 'Passed', v: counts.pass || 0, sub: `of ${checks.length} checks`, fg: SC.pass },
        { l: 'Needs review', v: counts.review || 0, sub: 'teacher decision', fg: SC.review },
        { l: 'Failed', v: counts.fail || 0, sub: counts.fail ? 'blocks approval' : 'nothing blocking', fg: counts.fail ? SC.fail : 'var(--color-text)' },
        { l: 'Objectives', v: `${cov.covered}/${cov.total}`, sub: 'supported by evidence', fg: cov.covered < cov.total ? SC.review : SC.pass }
      ],
      vc: { ...vcRaw, hasEv: !!vcRaw.ev, evText: vcRaw.evText || '', onEv: () => p.onViewEvidence && p.onViewEvidence(vcRaw.ev),
        hasAction: !!vcRaw.go, noAction: !vcRaw.go, onAction: () => p.onAction && p.onAction(vcRaw.go) }
    };
  }
}
</script>
</body>
</html>
