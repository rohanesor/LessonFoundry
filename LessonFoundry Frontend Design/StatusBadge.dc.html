<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/modernist-2d405345-c880-4218-92f2-cddc1804b608/styles.css">
</helmet>
<sc-if value="{{ isGlyph }}" hint-placeholder-val="{{ false }}"><span title="{{ label }}" style="display:inline-grid;place-items:center;width:18px;height:18px;flex:none;font-family:var(--font-body);font-size:11px;font-weight:800;line-height:1;color:{{ fg }};background:{{ bg }}"><sc-if value="{{ lock }}" hint-placeholder-val="{{ false }}"><svg width="9" height="11" viewBox="0 0 9 11"><rect x="0.5" y="4.5" width="8" height="6" fill="currentColor"></rect><path d="M2.3 4.6V3.2a2.2 2.2 0 0 1 4.4 0v1.4" stroke="currentColor" stroke-width="1.4" fill="none"></path></svg></sc-if><sc-if value="{{ noLock }}" hint-placeholder-val="{{ true }}">{{ g }}</sc-if></span></sc-if>
<sc-if value="{{ isChip }}" hint-placeholder-val="{{ true }}"><span style="display:inline-flex;align-items:center;gap:6px;padding:2px 8px;font-family:var(--font-body);font-size:11px;font-weight:600;letter-spacing:0.02em;line-height:16px;white-space:nowrap;color:{{ fg }};background:{{ bg }}"><sc-if value="{{ lock }}" hint-placeholder-val="{{ false }}"><svg width="9" height="11" viewBox="0 0 9 11"><rect x="0.5" y="4.5" width="8" height="6" fill="currentColor"></rect><path d="M2.3 4.6V3.2a2.2 2.2 0 0 1 4.4 0v1.4" stroke="currentColor" stroke-width="1.4" fill="none"></path></svg></sc-if><sc-if value="{{ noLock }}" hint-placeholder-val="{{ true }}"><span style="font-weight:800">{{ g }}</span></sc-if><span>{{ label }}</span></span></sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:200,&quot;height&quot;:40},&quot;status&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;pass&quot;,&quot;review&quot;,&quot;fail&quot;,&quot;info&quot;,&quot;pending&quot;,&quot;approved&quot;,&quot;locked&quot;,&quot;regen&quot;,&quot;running&quot;,&quot;edited&quot;,&quot;draft&quot;],&quot;default&quot;:&quot;pass&quot;,&quot;tsType&quot;:&quot;AssetStatus&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Validated&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;chip&quot;,&quot;glyph&quot;],&quot;default&quot;:&quot;chip&quot;,&quot;tsType&quot;:&quot;'chip'|'glyph'&quot;}}">
const G = 'oklch(0.45 0.11 150)', A = 'oklch(0.49 0.115 65)';
const ST = {
  pass: { fg: G, bg: 'oklch(0.94 0.035 150)', g: '✓', l: 'Validated' },
  review: { fg: A, bg: 'oklch(0.94 0.05 80)', g: '!', l: 'Needs review' },
  fail: { fg: 'var(--color-accent-700)', bg: 'var(--color-accent-200)', g: '×', l: 'Failed' },
  info: { fg: 'var(--color-neutral-800)', bg: 'var(--color-neutral-200)', g: 'i', l: 'Info' },
  pending: { fg: 'var(--color-neutral-700)', bg: 'var(--color-neutral-200)', g: '○', l: 'Pending' },
  approved: { fg: '#fff', bg: G, lock: true, l: 'Approved' },
  locked: { fg: '#fff', bg: G, lock: true, l: 'Locked' },
  regen: { fg: A, bg: 'oklch(0.94 0.05 80)', g: '↻', l: 'Regeneration required' },
  running: { fg: 'var(--color-text)', bg: 'var(--color-neutral-300)', g: '…', l: 'Running' },
  edited: { fg: 'var(--color-text)', bg: 'var(--color-neutral-300)', g: '✎', l: 'Teacher edited' },
  draft: { fg: 'var(--color-text)', bg: 'var(--color-neutral-200)', g: '●', l: 'Draft' }
};
class Component extends DCLogic {
  renderVals() {
    const s = ST[this.props.status] || ST.info;
    const isGlyph = this.props.variant === 'glyph';
    return { fg: s.fg, bg: s.bg, g: s.g, label: this.props.label ?? s.l, isGlyph, isChip: !isGlyph, lock: !!s.lock, noLock: !s.lock };
  }
}
</script>
</body>
</html>
